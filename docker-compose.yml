# Mediu local/self-hosted: PostgreSQL + aplicația. NEVERIFICAT încă (fără daemon Docker în mediul de dezvoltare inițial).
# Pași: docs/RUNBOOK.md → „Docker”.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?setează POSTGRES_PASSWORD în .env}
      POSTGRES_DB: dp_web
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dp -d dp_web']
      interval: 5s
      retries: 10

  app:
    image: dp-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dp:${POSTGRES_PASSWORD}@db:5432/dp_web
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
