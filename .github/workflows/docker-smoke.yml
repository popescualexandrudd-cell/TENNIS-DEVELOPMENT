name: Docker smoke test
on:
  push:
    branches: [codex/verify-tennis-docker-928cc3c]
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://dp:dp_docker_ci@127.0.0.1:5432/dp_web
      POSTGRES_PASSWORD: dp_docker_ci
      PAYLOAD_SECRET: docker-ci-only-not-a-secret
      CONTACT_HASH_SECRET: docker-ci-only-not-a-secret
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      SEED_ADMIN_EMAIL: docker-ci-admin@example.test
      SEED_ADMIN_PASSWORD: docker-ci-only-password-123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies and start Compose PostgreSQL
        run: |
          pnpm install --frozen-lockfile
          printf 'POSTGRES_PASSWORD=%s\nPAYLOAD_SECRET=%s\nCONTACT_HASH_SECRET=%s\nNEXT_PUBLIC_SITE_URL=%s\nSITE_ENV=staging\n' "$POSTGRES_PASSWORD" "$PAYLOAD_SECRET" "$CONTACT_HASH_SECRET" "$NEXT_PUBLIC_SITE_URL" > .env
          docker compose up -d --wait db
          pnpm migrate
          pnpm seed:dev
      - name: Build standalone image
        run: |
          docker build --network host --build-arg DATABASE_URL --build-arg NEXT_PUBLIC_SITE_URL -t dp-web:latest .
      - name: Start Compose and verify HTTP
        run: |
          docker compose up -d --wait app
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/ro -o "$RUNNER_TEMP/docker-ro.html"
          grep -qi '<html' "$RUNNER_TEMP/docker-ro.html"
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes
