name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dp
          POSTGRES_PASSWORD: dp_ci
          POSTGRES_DB: dp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Date sintetice, bază de test efemeră. Niciun secret real.
      DATABASE_URL: postgresql://dp:dp_ci@localhost:5432/dp_ci
      TEST_DATABASE_URL: postgresql://dp:dp_ci@localhost:5432/dp_ci_test
      PAYLOAD_SECRET: ci-only-not-secret
      CONTACT_HASH_SECRET: ci-only-not-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password-123
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/contrast.mjs
      - run: pnpm test:unit
      - name: Create test database
        run: PGPASSWORD=dp_ci psql -h localhost -U dp -d dp_ci -c 'CREATE DATABASE dp_ci_test'
      - run: pnpm test:int
      - name: Migrate + seed (date sintetice)
        run: pnpm migrate && pnpm seed:dev
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
