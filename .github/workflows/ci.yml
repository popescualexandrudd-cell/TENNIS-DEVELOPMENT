name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # Date sintetice, bază de test efemeră. Niciun secret real.
      DATABASE_URL: postgresql://dp:dp_ci@localhost:5432/dp_ci
      TEST_DATABASE_URL: postgresql://dp:dp_ci@localhost:5432/dp_ci_test
      PAYLOAD_SECRET: ci-only-not-secret
      CONTACT_HASH_SECRET: ci-only-not-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password-123
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/contrast.mjs
      - run: pnpm test:unit
      - run: node --test tests/language-switch.test.mjs tests/turbopack-root.test.mjs
      - name: Start native PostgreSQL and create test databases
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE dp LOGIN PASSWORD 'dp_ci'"
          sudo -u postgres createdb --owner=dp dp_ci
          sudo -u postgres createdb --owner=dp dp_ci_test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'SELECT 1'
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'SELECT 1'
      - run: pnpm test:int
      - name: Migrate + seed (date sintetice)
        run: pnpm migrate && pnpm seed:dev
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
